  const status = document.getElementById('status');
  const help = document.getElementById('help');
  const manual = document.getElementById('manual');
  const keyInput = document.getElementById('keyInput');
  const unlock = document.getElementById('unlock');

  function b64urlToBytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const raw = atob(s);
    return Uint8Array.from(raw, c => c.charCodeAt(0));
  }

  async function decrypt(keyText) {
    try {
      status.textContent = 'Decrypting…';
      const keyBytes = b64urlToBytes(keyText.trim());
      if (keyBytes.length !== 32) throw new Error('Wrong key length');

      const cryptoKey = await crypto.subtle.importKey(
        'raw', keyBytes, { name: 'AES-GCM' }, false, ['decrypt']
      );

      const plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64urlToBytes(IV), tagLength: 128 },
        cryptoKey,
        b64urlToBytes(CIPHERTEXT)
      );

      const html = new TextDecoder().decode(plain);

      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      help.textContent = 'Enter the secret key to unlock this page.';
      manual.hidden = false;
      status.textContent = 'Could not decrypt. Check the key.';
      console.error(err);
    }
  }

  function keyFromHash() {
    const params = new URLSearchParams(location.hash.slice(1));
    return params.get('k') || '';
  }

  unlock.addEventListener('click', () => decrypt(keyInput.value));
  keyInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') decrypt(keyInput.value);
  });

  const k = keyFromHash();
  if (k) {
    keyInput.value = k;
    decrypt(k);
  } else {
    help.textContent = 'Enter the secret key to unlock this page.';
    manual.hidden = false;
    status.textContent = '';
  }
})();
