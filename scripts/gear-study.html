<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Climbing gear — model studies</title><style>
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:#e7e6dd;color:#243b38;font:14px system-ui,sans-serif}header{flex:none;display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:16px 24px;background:#f6f3e9;border-bottom:1px solid #c8ccbc}h1{font-size:16px;margin:0 auto 0 0}button,select{font:inherit;padding:9px;border:1px solid #aab7a3;background:#fffdf6;color:inherit;border-radius:4px}main{flex:1;min-height:0;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none}#status{position:absolute;bottom:15px;left:22px;font-size:12px;color:#64766e;pointer-events:none}
</style></head><body><header><h1>Climbing gear / form studies</h1><label>Object <select id="item"><option value="rope">Rope</option><option value="harness">Harness</option><option value="quickdraws">Quickdraws</option><option value="carabiner">Locking carabiner</option><option value="stack">Locking carabiner stack</option><option value="axe">Ice axe</option><option value="grigri">GriGri</option><option value="atc">ATC</option><option value="shoes">Shoes</option><option value="board">Full pegboard</option></select></label><button type="button" id="front">Front</button><button type="button" id="angle">Three-quarter</button><button type="button" id="rear">Rear</button><label><input type="checkbox" id="pixel"> Cabin resolution</label></header><main><canvas id="view" aria-label="Rotatable 3D gear study"></canvas><span id="status">Loading…</span></main>
<script type="module">
import * as THREE from '../js/vendor/three.module.min.js';
import {finishGearMaterials} from '../js/gear-materials.mjs';
const canvas=document.querySelector('canvas'),status=document.querySelector('#status'),select=document.querySelector('#item');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
const scene=new THREE.Scene();scene.background=new THREE.Color('#e2e3db');scene.add(new THREE.HemisphereLight('#fff8ed','#778a83',2.4));
const key=new THREE.DirectionalLight('#fff3dd',3.5);key.position.set(-3,5,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-1;key.shadow.camera.right=1;key.shadow.camera.top=1;key.shadow.camera.bottom=-1;key.shadow.bias=-.0002;scene.add(key);
const rim=new THREE.DirectionalLight('#c9e8ff',2.0);rim.position.set(3,2,-1);scene.add(rim);
const camera=new THREE.PerspectiveCamera(34,1,.001,100);let model,size=1,center=new THREE.Vector3(),yaw=.18,pitch=.10,drag=null;
const definitions={rope:['gear-rope','createClimbingRope'],harness:['gear-harness','createClimbingHarness'],quickdraws:['gear-carabiners','createQuickdrawRack'],carabiner:['gear-carabiners','createCarabiner'],stack:['gear-carabiners','createCarabinerStack'],axe:['gear-ice-axe','createIceAxe'],grigri:['gear-grigri','createGrigri'],atc:['gear-atc','createATC'],shoes:['gear-shoes','createClimbingShoes'],board:['cabin-gear','createPegboard']};
function placeCamera(){const distance=size*1.85/Math.min(1,camera.aspect);camera.position.set(center.x+distance*Math.sin(yaw)*Math.cos(pitch),center.y+distance*Math.sin(pitch),center.z+distance*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(center);}
function resize(){const rect=canvas.parentElement.getBoundingClientRect();renderer.setSize(rect.width,rect.height,false);camera.aspect=rect.width/rect.height;camera.updateProjectionMatrix();placeCamera();}
new ResizeObserver(resize).observe(canvas.parentElement);
async function load(){
 status.textContent='Loading…';
 try{const [file,method]=definitions[select.value];const next=(await import('../js/'+file+'.mjs'))[method]({locking:true});if(model)scene.remove(model);model=finishGearMaterials(next);scene.add(model);const bounds=new THREE.Box3().setFromObject(model),dims=bounds.getSize(new THREE.Vector3());bounds.getCenter(center);size=Math.max(...dims.toArray());placeCamera();let meshes=0,triangles=0;model.traverse(m=>{if(m.isMesh){meshes++;triangles+=(m.geometry.index?.count??m.geometry.attributes.position.count)/3*(m.isInstancedMesh?m.count:1);}});status.textContent=`${select.options[select.selectedIndex].text} · ${dims.toArray().map(n=>(n*1000).toFixed(0)).join(' × ')} mm · ${meshes} meshes · ${Math.round(triangles).toLocaleString()} triangles · drag to orbit`;}
 catch(error){status.textContent='This study is still being built. Choose another item for now.';console.info(error.message);}
}
const requested=new URLSearchParams(location.search).get('item')?.toLowerCase();select.value=({'locking carabiner':'carabiner','full pegboard':'board'})[requested]||(definitions[requested]?requested:'rope');select.addEventListener('change',()=>{history.replaceState(null,'','?item='+select.value);load();});document.querySelector('#front').onclick=()=>{yaw=0;pitch=0;placeCamera();};document.querySelector('#angle').onclick=()=>{yaw=.65;pitch=.23;placeCamera();};document.querySelector('#rear').onclick=()=>{yaw=Math.PI;pitch=.05;placeCamera();};document.querySelector('#pixel').onchange=event=>renderer.setPixelRatio(event.target.checked?.65:Math.min(devicePixelRatio,2));
canvas.onpointerdown=event=>{drag=[event.clientX,event.clientY];canvas.setPointerCapture(event.pointerId);};canvas.onpointermove=event=>{if(!drag)return;yaw-=(event.clientX-drag[0])*.007;pitch=Math.max(-1.4,Math.min(1.4,pitch+(event.clientY-drag[1])*.007));drag=[event.clientX,event.clientY];placeCamera();};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
resize();await load();renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
